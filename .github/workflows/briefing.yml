name: 오늘의 브리핑

# 지역별 강사 공고 메일(울산·경남·대학평생교육원)과 캠프 수주 메일을 한 통으로 묶어 BRIEFING_TO 로 보낸다.
# 기존 지역별 메일은 그대로 나간다. 하루 한 번만 보낸다 (보낸 날짜는 briefing-state 브랜치에 보관).
on:
  # 이 저장소의 수집이 끝날 때마다 확인: 모든 곳의 오늘 자료가 모였으면 바로 보낸다
  workflow_run:
    workflows: ["매일 강사 공고 수집·메일 발송", "캠프 수주 공고 (나라장터)"]
    types: [completed]
  # 경남·평생교육원 보고서가 나중에 도착하는 날을 위한 예비 확인 (GitHub 예약은 몇 시간씩 밀릴 수 있음).
  # 09:00 KST 가 지나면 도착한 것만으로 보낸다 (config/briefing.yaml 의 send_anyway_after)
  schedule:
    - cron: "53 21 * * *" # 06:53 KST
    - cron: "7 23 * * *" # 08:07 KST
    - cron: "23 0 * * *" # 09:23 KST
  workflow_dispatch:
    inputs:
      send_mail:
        description: "메일 발송 (끄면 결과를 실행 기록에서만 확인)"
        type: boolean
        default: true
      force:
        description: "오늘 이미 보냈거나 자료가 덜 와도 보냄 (시험용)"
        type: boolean
        default: false

permissions:
  contents: write # briefing-state 브랜치에 보낸 날짜 저장

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: src
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 수집 기록(DB)은 읽기만 한다 (저장하지 않음)
      - name: 수집 기록(DB) 가져오기
        run: bash scripts/state_db.sh restore

      - name: 마지막 발송 날짜 가져오기
        run: |
          mkdir -p data
          if git fetch --depth=1 origin briefing-state 2>/dev/null; then
            git show FETCH_HEAD:last_sent.txt > data/briefing_last_sent.txt || true
          fi
          echo "마지막 발송: $(cat data/briefing_last_sent.txt 2>/dev/null || echo 없음)"

      - name: 브리핑 → 메일
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          BRIEFING_TO: ${{ secrets.BRIEFING_TO }}
          SEND_MAIL: ${{ github.event_name != 'workflow_dispatch' || inputs.send_mail }}
          FORCE: ${{ inputs.force }}
        run: |
          args=""
          if [ "$SEND_MAIL" != "true" ]; then args="--no-mail"; fi
          if [ "$FORCE" = "true" ]; then args="$args --force"; fi
          before=$(cat data/briefing_last_sent.txt 2>/dev/null || true)
          python -m ulsan_jobs briefing --db data/postings.db --state data/briefing_last_sent.txt --html out/briefing.html $args
          after=$(cat data/briefing_last_sent.txt 2>/dev/null || true)
          if [ "$before" != "$after" ]; then echo "SAVE_STATE=1" >> "$GITHUB_ENV"; fi

      - name: 발송 날짜 저장
        if: env.SAVE_STATE == '1'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tmp=$(mktemp -d)
          cp data/briefing_last_sent.txt "$tmp/last_sent.txt"
          cd "$tmp"
          git init -q -b briefing-state
          git add last_sent.txt
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "브리핑 발송 $(cat last_sent.txt)"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" briefing-state

      - name: 브리핑 본문 보관 (7일)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-${{ github.run_id }}
          path: out/briefing.html
          if-no-files-found: ignore
          retention-days: 7

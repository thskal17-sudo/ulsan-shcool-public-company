name: CI

on:
  push:
    branches-ignore: [state]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  # 실제 사이트에서 수집이 되는지 확인 (메일·DB 저장 없음). 결과 엑셀은 Artifacts 에 올라간다.
  live-check:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m ulsan_jobs run --no-mail --db "$RUNNER_TEMP/ci.db" --out out
      - uses: actions/upload-artifact@v4
        with:
          name: live-check-report
          path: out/*.xlsx
          retention-days: 7

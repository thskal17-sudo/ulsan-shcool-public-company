name: 매일 강사 공고 수집·메일 발송

on:
  schedule:
    # GitHub 예약 실행은 제시간을 보장하지 않는다. 07:00 으로 두었더니 09:19~10:30 에 돌았다
    # (2026-09-28~29, 2시간 반~3시간 반 지연). 밀려도 아침 전에 메일이 오도록 새벽으로 당기고,
    # 통째로 빠지는 날에 대비해 예비 실행을 하나 더 둔다. 예약 실행은 --once-daily 라서 전체 메일은
    # 하루 한 번이고, 그날 메일을 이미 보냈으면 새 공고가 있을 때만 '보충' 메일을 보낸다.
    # 같은 concurrency 그룹(daily-collect)의 camp.yml(02:23·05:23 KST)과 겹치지 않게 46분 앞에 둔다.
    - cron: "37 16 * * *" # 01:37 KST
    - cron: "37 19 * * *" # 04:37 KST (예비)
  workflow_dispatch:
    inputs:
      send_mail:
        description: "메일 발송 (끄면 수집·엑셀만 하고 결과는 Artifacts 에서 확인)"
        type: boolean
        default: true

permissions:
  contents: write # state 브랜치에 수집 기록(DB) 저장

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      retry_sources: ${{ steps.run.outputs.retry_sources }}
    env:
      PYTHONPATH: src
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 이전 수집 기록(DB) 가져오기
        run: bash scripts/state_db.sh restore

      - name: 수집 → 엑셀 → 메일
        id: run
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          WORK24_API_KEY: ${{ secrets.WORK24_API_KEY }}
          SEND_MAIL: ${{ github.event_name == 'schedule' || inputs.send_mail }}
          EVENT: ${{ github.event_name }}
        run: |
          mail=""
          if [ "$SEND_MAIL" != "true" ]; then mail="--no-mail"; fi
          # 예약 실행만 하루 한 번 전체 메일. 손으로 돌리면 오늘 이미 보냈어도 전체 메일을 다시 보낸다
          if [ "$EVENT" = "schedule" ]; then mail="$mail --once-daily"; fi
          python -m ulsan_jobs run --db data/postings.db --out out --retry-list out/retry_sources.txt $mail
          echo "retry_sources=$(cat out/retry_sources.txt)" >> "$GITHUB_OUTPUT"

      - name: 엑셀 보관 (30일)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_id }}
          path: out/*.xlsx
          if-no-files-found: ignore
          retention-days: 30

      # 메일을 보내지 못한 공고는 DB 에 '미발송'으로 남아 다음 실행 때 다시 신규로 보내진다
      - name: 수집 기록(DB) 저장
        if: always() && hashFiles('data/postings.db') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/state_db.sh save

  # 구·군청 등 일부 사이트는 수집 서버(GitHub 가 배정하는 해외 서버)의 지역에 따라 접속이 막힌다.
  # 접속 안 된 사이트가 있으면 새 서버를 받아 그 사이트만 한 번 더 수집하고, 새 공고가 있을 때만 보충 메일을 보낸다.
  catch-up:
    needs: collect
    if: needs.collect.outputs.retry_sources != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 이전 수집 기록(DB) 가져오기
        run: bash scripts/state_db.sh restore

      - name: 접속 안 된 사이트 다시 수집 → 보충 메일
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          WORK24_API_KEY: ${{ secrets.WORK24_API_KEY }}
          SEND_MAIL: ${{ github.event_name == 'schedule' || inputs.send_mail }}
          RETRY_SOURCES: ${{ needs.collect.outputs.retry_sources }}
        run: |
          mail=""
          if [ "$SEND_MAIL" != "true" ]; then mail="--no-mail"; fi
          python -m ulsan_jobs run --db data/postings.db --out out --catch-up --source $RETRY_SOURCES $mail

      - name: 엑셀 보관 (30일)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_id }}-catch-up
          path: out/*.xlsx
          if-no-files-found: ignore
          retention-days: 30

      - name: 수집 기록(DB) 저장
        if: always() && hashFiles('data/postings.db') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/state_db.sh save

name: 매일 강사 공고 수집·메일 발송

on:
  schedule:
    - cron: "0 22 * * *" # 매일 07:00 KST (= UTC 22:00). GitHub 사정에 따라 수십 분 늦어질 수 있음
  workflow_dispatch:
    inputs:
      send_mail:
        description: "메일 발송 (끄면 수집·엑셀만 하고 결과는 Artifacts 에서 확인)"
        type: boolean
        default: true

permissions:
  contents: write # state 브랜치에 수집 기록(DB) 저장

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 이전 수집 기록(DB) 가져오기
        run: |
          mkdir -p data
          if git fetch --depth=1 origin state 2>/dev/null; then
            git show FETCH_HEAD:postings.db > data/postings.db
            echo "기존 수집 기록 복원 ($(stat -c %s data/postings.db) bytes)"
          else
            echo "state 브랜치 없음: 첫 실행"
          fi

      - name: 수집 → 엑셀 → 메일
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          WORK24_API_KEY: ${{ secrets.WORK24_API_KEY }}
          SEND_MAIL: ${{ github.event_name == 'schedule' || inputs.send_mail }}
        run: |
          if [ "$SEND_MAIL" = "true" ]; then
            python -m ulsan_jobs run --db data/postings.db --out out
          else
            python -m ulsan_jobs run --db data/postings.db --out out --no-mail
          fi

      - name: 엑셀 보관 (30일)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_id }}
          path: out/*.xlsx
          if-no-files-found: ignore
          retention-days: 30

      # 메일을 보내지 못한 공고는 DB 에 '미발송'으로 남아 다음 실행 때 다시 신규로 보내진다
      - name: 수집 기록(DB) 저장
        if: always() && hashFiles('data/postings.db') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tmp=$(mktemp -d)
          cp data/postings.db "$tmp/"
          cd "$tmp"
          git init -q -b state
          git add postings.db
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "수집 기록 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" state

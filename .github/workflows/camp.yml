name: 캠프·교육 수주 공고 (나라장터·S2B)

# 나라장터 용역 입찰공고와 S2B 학교장터 견적요청 중 진로·취업·창업 캠프와 교육 운영 공고를 모아
# 새 공고가 있을 때만 메일로 보낸다.
# 강사 공고 수집(daily.yml)과 같은 DB(state 브랜치)를 쓰므로 같은 concurrency 그룹으로 차례대로 실행한다.
on:
  schedule:
    # GitHub 예약 실행은 제시간을 보장하지 않는다 (2026-09 기준 3~4시간씩 밀림).
    # 밀려도 아침 전에 메일이 오도록 새벽으로 당기고, 통째로 빠지는 날에 대비해 한 번 더 잡는다.
    # 두 번째 실행은 첫 실행 뒤에 새로 올라온 공고가 있을 때만 메일을 보낸다 (이미 알린 공고는 다시 안 보냄).
    - cron: "23 17 * * *" # 02:23 KST
    - cron: "23 20 * * *" # 05:23 KST (예비)
    # S2B 학교 견적은 마감이 1~3일로 짧아서 낮에 한 번 더 본다 (새 공고가 있을 때만 메일)
    - cron: "17 4 * * *" # 13:17 KST
  workflow_dispatch:
    inputs:
      send_mail:
        description: "메일 발송 (끄면 결과를 실행 기록에서만 확인)"
        type: boolean
        default: true
      days:
        description: "최근 며칠치 공고를 볼지 (비우면 기본값: 처음 10일, 이후 2일)"
        required: false
        default: ""
      recheck:
        description: "아직 메일로 안 알린 공고의 참가가능지역을 다시 조회"
        type: boolean
        default: false

permissions:
  contents: write # state 브랜치에 수집 기록(DB) 저장

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  camp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 이전 수집 기록(DB) 가져오기
        run: bash scripts/state_db.sh restore

      - name: 나라장터·S2B 공고 수집 → 메일
        env:
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SEND_MAIL: ${{ github.event_name == 'schedule' || inputs.send_mail }}
          DAYS: ${{ inputs.days }}
          RECHECK: ${{ inputs.recheck }}
        run: |
          args=""
          if [ "$SEND_MAIL" != "true" ]; then args="--no-mail"; fi
          if [ -n "$DAYS" ]; then args="$args --days $DAYS"; fi
          if [ "$RECHECK" = "true" ]; then args="$args --recheck"; fi
          python -m ulsan_jobs camp --db data/postings.db $args

      # 메일을 보내지 못한 공고는 DB 에 '미발송'으로 남아 다음 실행 때 다시 보내진다
      - name: 수집 기록(DB) 저장
        if: always() && hashFiles('data/postings.db') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/state_db.sh save

name: 캠프 수주 공고 (나라장터)

# 나라장터 용역 입찰공고 중 진로·취업·창업 캠프/교육 운영 공고를 모아 새 공고가 있을 때만 메일로 보낸다.
# 강사 공고 수집(daily.yml)과 같은 DB(state 브랜치)를 쓰므로 같은 concurrency 그룹으로 차례대로 실행한다.
on:
  schedule:
    - cron: "40 22 * * *" # 매일 07:40 KST (= UTC 22:40). GitHub 사정에 따라 늦어질 수 있음
  workflow_dispatch:
    inputs:
      send_mail:
        description: "메일 발송 (끄면 결과를 실행 기록에서만 확인)"
        type: boolean
        default: true
      days:
        description: "최근 며칠치 공고를 볼지 (비우면 기본값: 처음 10일, 이후 2일)"
        required: false
        default: ""

permissions:
  contents: write # state 브랜치에 수집 기록(DB) 저장

concurrency:
  group: daily-collect
  cancel-in-progress: false

jobs:
  camp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 이전 수집 기록(DB) 가져오기
        run: bash scripts/state_db.sh restore

      - name: 나라장터 공고 수집 → 메일
        env:
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SEND_MAIL: ${{ github.event_name == 'schedule' || inputs.send_mail }}
          DAYS: ${{ inputs.days }}
        run: |
          args=""
          if [ "$SEND_MAIL" != "true" ]; then args="--no-mail"; fi
          if [ -n "$DAYS" ]; then args="$args --days $DAYS"; fi
          python -m ulsan_jobs camp --db data/postings.db $args

      # 메일을 보내지 못한 공고는 DB 에 '미발송'으로 남아 다음 실행 때 다시 보내진다
      - name: 수집 기록(DB) 저장
        if: always() && hashFiles('data/postings.db') != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/state_db.sh save

# 울산 강사 구인공고 수집 대상 목록
#
# - phase: 구현 단계. max_phase 이하이면서 enabled: true 인 소스만 매일 수집한다.
# - verified: GitHub Actions 에서 실제 접속·목록 구조를 확인한 소스.
# - keyword_filter: 강사 전용 게시판이면 false (모든 글 수집), 일반 게시판이면 true (강사 키워드로 거름).
# - options: 수집기별 설정 (page_param: 페이지 번호 파라미터, key_param: 게시글 번호 파라미터 등).
#   자세한 설명은 src/ulsan_jobs/collectors/board.py 머리말 참고.
#
# 새 소스를 추가할 때는 먼저 진단 도구로 구조를 확인한다:
#   GitHub Actions > 사이트 진단 (probe) > Run workflow > args: --no-reach --url <목록 주소>

max_phase: 2

sources:
  # ─────────────────────────────── 국가·공공 (공식 API)
  - id: work24_api
    name: 고용24(워크넷) 채용정보 Open API
    org_type: 국가·공공기관
    district: 울산전체
    collector: work24_api
    url: https://www.work24.go.kr/cm/e/a/0110/selectOpenApiIntro.do
    params:
      region: "31000"   # 울산광역시 전체
      keyword: 강사
    auth_env: WORK24_API_KEY  # 없으면 '설정필요'로 표시하고 건너뜀
    keyword_filter: true
    phase: 1
    enabled: true
    verified: false
  - id: alio_api
    name: 잡알리오 공공기관 채용정보 API

    url: https://www.data.go.kr/data/15125273/openapi.do
    params:
      work_region: 울산
    auth_env: DATA_GO_KR_KEY
    keyword_filter: true
    phase: 2
    enabled: false  # 3단계: 공공데이터포털 인증키와 응답 형식 확인 후 구현
    verified: false


# 울산 강사 구인공고 수집 대상 목록 (초안)
#
# - verified: Phase 0에서 실제 접속·파싱을 확인하면 true로 바꾼다.
# - enabled: false 인 항목은 수집하지 않는다 (주소 미확인·추가 조사 필요).
# - keyword_filter: 강사 전용 게시판이면 false (모든 글을 수집), 일반 공지 게시판이면 true.
# - phase: 구현 우선순위 (1 = MVP).
#
# 주소는 설계 시점(2026-09) 웹 검색으로 확인한 값이며, 실제 목록 URL·셀렉터는 구현 시 검증한다.


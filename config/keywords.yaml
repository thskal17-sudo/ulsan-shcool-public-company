# 강사 구인공고 판별·분류 규칙
# 제목 기준으로 판단하며, 비교할 때 공백은 무시한다 ('회원 모집' == '회원모집').

# 하나라도 포함되면 강사 공고 후보
# (sources.yaml 에서 keyword_filter: false 인 강사 전용 게시판은 이 검사를 건너뛴다)
include:
  - 강사
  - 인력풀
  - 지도자
  - 지도사
  - 코치
  - 트레이너
  - 강습
  - 방과후
  - 늘봄
  - 튜터
  - 교관

# 포함되면 제외 (강사를 뽑는 공고가 아님)
exclude:
  - 수강생
  - 강사소개  # 문화예술회관 아카데미의 "강의계획서 및 강사소개서" 안내
  - 강습생
  - 회원 모집
  - 교육생
  - 포상
  - 공모전

# 모집이 끝난 뒤의 결과 공고, 또는 제목에 마감 표시가 붙은 공고
result_notice:
  - "[마감]"
  - (마감)
  - 마감되었습니다
  - 조기마감
  - 합격자
  - 최종합격
  - 결과
  - 면접대상
  - 서류전형
  - 최종적격
  - 서류적격
  - 적격자
  - 적격대상  # '적격심사'(입찰 방식)는 결과가 아니라서 넣지 않음
  - 대상자 발표
  - 최종수탁자
  - 최종선발
  - 위촉 예정자
  - 위촉예정
  - 대상 결정  # '위·수탁 대상 결정 공고' (수련관)
  - 결정 공고  # '서류심사 결정 공고', '최종합격자 결정 공고'
  - 선정
  - 취소

# true 면 결과공고도 "결과공고" 상태로 엑셀에 남긴다
keep_result_notices: false

# 신규 시트에 넣을 최대 게시 경과일 (첫 실행 때 오래된 글이 쏟아지는 것 방지)
new_max_age_days: 45
# 마감일을 모르는 공고를 진행중으로 볼 기간 (게시일 기준)
active_max_age_days: 30
# 마감임박 기준 (D-n 이내)
closing_soon_days: 3

# 분야 분류 (위에서부터 먼저 매칭되는 분야로 분류, 없으면 "기타")
# 제목과 기관명에서 찾는다. '!' 로 시작하는 단어가 있으면 그 분야는 건너뛴다
# (예: 청소년방과후아카데미는 학교 방과후가 아님, 공단 수영장 시간강사는 학교 시간강사가 아님)
categories:
  방과후·늘봄: [방과후, 늘봄, 돌봄, "!방과후아카데미"]
  학교 시간강사: [시간강사, 기간제, 계약제, 교원, 교과, 소인수, 공동교육과정, "!공단", "!수영장", "!체육센터", "!수련관"]
  체육·수영: [수영, 헬스, 요가, 필라테스, 에어로빅, 생활체육, 체육, 스포츠, 아쿠아, 강습]
  평생교육·문화: [평생, 도서관, 문화, 예술, 공예, 음악, 미술, 인문, 강좌, 특강, 교육강사]
  직업훈련: [직업, 훈련, 자격증, 새일, 취업, 창업]
  학교 기타: [초등학교, 중학교, 고등학교, 유치원, 학교]

# 강사 구인공고 판별·분류 규칙 (초안)
# 제목 기준으로 판단하며, 필요한 경우 상세 본문까지 확인한다.

# 하나라도 포함되면 강사 공고 후보
include:
  - 강사
  - 인력풀
  - 지도자
  - 코치
  - 트레이너
  - 강습
  - 방과후
  - 늘봄
  - 튜터
  - 교관

# 포함되면 제외 (강사 공고가 아니거나, 모집이 끝난 결과 공고)
exclude:
  - 수강생
  - 강습생
  - 회원모집
  - 회원 모집
  - 합격자
  - 최종합격
  - 결과
  - 면접대상
  - 서류전형
  - 위촉 예정자
  - 선정
  - 취소

# 결과공고를 제외하지 않고 "결과공고" 상태로 남길지 여부
keep_result_notices: false

# 분야 분류 (위에서부터 먼저 매칭되는 분야로 분류, 없으면 "기타")
categories:
  방과후·늘봄: [방과후, 늘봄, 돌봄, 초등학교, 중학교, 고등학교, 유치원]
  체육·수영: [수영, 헬스, 요가, 필라테스, 에어로빅, 생활체육, 체육, 스포츠, 아쿠아]
  평생교육·문화: [평생, 도서관, 문화, 예술, 공예, 음악, 미술, 인문]
  직업훈련: [직업, 훈련, 자격증, 새일, 취업, 창업]

# 캠프 수주 공고: 나라장터 용역 입찰공고 중 진로·취업·창업 캠프/교육 운영 공고를 모아 메일로 보낸다.
#   python -m ulsan_jobs camp [--no-mail]
# 공고명에 include 단어가 하나라도 있고 exclude 단어가 하나도 없으면 수집한다 (띄어쓰기는 무시).
# exclude 는 글자 일부만 맞아도 빠지므로 짧은 단어는 조심 ('청소' → '청소년'도 빠짐).

# 참가가능지역에 이 단어가 들어 있으면 참여 가능으로 본다. 지역 제한이 없는 공고도 참여 가능.
home_regions:
  - 부산

# 추정가격(부가세 제외, 원)이 이 금액 이하이거나 계약방법이 수의계약이면 '바로 지원' 후보
small_max: 20000000

# 매 실행마다 최근 며칠치 공고를 다시 훑는다 (GitHub 실행이 늦거나 하루 빠져도 놓치지 않게)
lookback_days: 2
# 처음 실행할 때(기록이 없을 때)는 이만큼 거슬러 올라가 마감 전 공고를 모은다
first_lookback_days: 10
# 이미 알린 공고 중 마감이 이 일수 안으로 남으면 '마감임박'으로 다시 보여준다
closing_soon_days: 3

include:
  - 진로
  - 취업
  - 창업
  - 기업가정신
  - 캠프
  - 직업체험
  - 멘토링
  - 모의면접
  - 면접
  - 자기소개서
  - 커리어
  - 잡페어
  - 미래설계
  - 꿈길
  - 비즈쿨

exclude:
  - 설계용역  # '설계'만 쓰면 '미래설계·진로설계'까지 걸러짐
  - 실시설계
  - 기본설계
  - 감리
  - 측량
  - 급식
  - 청소용역  # '청소'만 쓰면 '청소년'까지 걸러짐
  - 환경미화
  - 경비용역
  - 방역
  - 시설관리
  - 유지보수
  - 유지관리
  - 전산
  - 시스템
  - 홈페이지
  - 소프트웨어
  - 정보화
  - 인쇄
  - 차량
  - 버스
  - 임차
  - 폐기물
  - 조경
  - 보험
  - 회계감사
  - 실태조사
  - 타당성
  - 연구용역
  - 학술용역

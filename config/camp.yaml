# 캠프 수주 공고: 나라장터 용역 입찰공고 중 진로·취업·창업 캠프와 교육 운영 공고를 모아 메일로 보낸다.
#   python -m ulsan_jobs camp [--no-mail]
# 공고명(띄어쓰기 무시)에 exclude 단어가 하나도 없고, 아래 셋 중 하나에 맞으면 수집한다.
#   1. include 단어가 있음                       → 분야 '진로·취업·창업'
#   2. include_with 의 단어 + 함께 올 단어가 있음 → 분야 '진로·취업·창업' ('캠프'만으로는 안 잡음)
#   3. education 단어가 있음                     → 분야 '교육' (메일에서 따로 표시)
# exclude 는 글자 일부만 맞아도 빠지므로 짧은 단어는 조심 ('청소' → '청소년'도 빠짐).

# 참가가능지역에 이 단어가 들어 있으면 참여 가능으로 본다. 지역 제한이 없는 공고도 참여 가능.
home_regions:
  - 부산

# 추정가격(부가세 제외, 원)이 이 금액 이하이거나 계약방법이 수의계약이면 '바로 지원' 후보
small_max: 20000000

# 매 실행마다 최근 며칠치 공고를 다시 훑는다 (GitHub 실행이 늦거나 하루 빠져도 놓치지 않게)
lookback_days: 2
# 처음 실행할 때(기록이 없을 때)는 이만큼 거슬러 올라가 마감 전 공고를 모은다
first_lookback_days: 10
# 이미 알린 공고 중 마감이 이 일수 안으로 남으면 '마감임박'으로 다시 보여준다
closing_soon_days: 3

# S2B 학교장터의 견적요청·소액수의 공고도 같이 모은다 (9/29 추가).
# 학교가 2천만원 이하로 사는 캠프·교육은 대부분 나라장터가 아니라 여기에 올라온다.
#   - 1인 수의 견적은 대부분 학교가 업체를 미리 정해 둔 것(공급업체 선택) → '참고'(영업 대상 학교)
#   - 전체공개이거나 부산 업체가 낼 수 있는 견적 → '바로지원'
s2b:
  enabled: true
  regions: [부산, 울산, 경남]  # 학교 소재지(S2B 지역 구분)
  lookback_days: 2
  first_lookback_days: 10
  max_pages: 120  # 지역마다 한 번에 읽을 최대 쪽수 (한 쪽 10건)

include:
  - 진로
  - 취업
  - 창업
  - 기업가정신
  - 직업체험
  - 멘토링
  - 모의면접
  - 면접
  - 자기소개서
  - 커리어
  - 잡페어
  - 미래설계
  - 꿈길
  - 비즈쿨

# 뜻이 넓은 단어: 오른쪽 단어 중 하나가 제목에 함께 있을 때만 인정
# (9/29 '미식학 캠프', 'K-pop 송캠프'가 '캠프'만으로 바로지원에 들어옴)
include_with:
  캠프: [직업, 진학, 꿈, 미래, 기업가, 리더십, 비즈]

# 교육 운영 용역 전반 (강사 섭외로 수행할 수 있는 것). 9/29 추가
education:
  words:
    - 교육
  # 기관·시설 이름 속 '교육'은 교육 프로그램이 아니라서 빼고 본다
  # (예: '부산광역시교육청 주차장 도색' → 교육 아님, '교육청 진로교육 운영' → 교육)
  ignore:
    - 교육청
    - 교육지원청
    - 교육부
    - 교육감
    - 교육장
    - 교육원
    - 교육재단
    - 교육센터
    - 교육관
    - 교육시설
    - 교육환경
    - 교육용
    - 교육정보
    - 교육행정
    - 교육기자재
    - 교육연구정보원
    - 교육연수원
    - 교육복지  # 교육복지우선지원사업(예산 이름). '교육복지 쿠킹 프로그램'은 교육 운영이 아님
    - 교육발전특구
    - 교육특구
  # 교육 분야에서만 빼는 말: 교육 '운영'이 아니라 연구·제작·행사·여행 용역 (9/29 첫 실행에서 확인)
  exclude:
    - 연구
    - 분석
    - 성과평가
    - 영상
    - 제작
    - 여행
    - 학술대회
    - 외국어
    - 건립
    - 공모

exclude:
  - 설계용역  # '설계'만 쓰면 '미래설계·진로설계'까지 걸러짐
  - 실시설계
  - 기본설계
  - 감리
  - 측량
  - 급식
  - 청소용역  # '청소'만 쓰면 '청소년'까지 걸러짐
  - 환경미화
  - 경비용역
  - 방역
  - 시설관리
  - 유지보수
  - 유지관리
  - 전산
  - 시스템
  - 홈페이지
  - 소프트웨어
  - 정보화
  - 인쇄
  - 차량
  - 버스
  - 임차
  - 폐기물
  - 조경
  - 보험
  - 회계감사
  - 실태조사
  - 타당성
  - 연구용역
  - 학술용역
  # 첫 시험 실행(9/29)에서 걸린 엉뚱한 공고들
  - 스키
  - 영어
  - 국외
  - 해외
  - 회계
  - 정산
  - 성과분석
  - 발전방안
  - 렌탈
  - 채점
  - 물품임대
  # '교육' 추가(9/29)와 함께: 전문 자격이 필요한 체육·안전 교육
  - 수영
  - 승마
  - 골프
  - 운전
  - 소방
  - 심폐소생
  - 응급처치
  - 안전교육
  # S2B 학교 견적에서 진로·교육 단어와 함께 자주 나오는 엉뚱한 것 (9/29 확인)
  - 관람  # 진로체험학습 공연 관람
  - 인형극
  - 운송
  - 수송
  - 교체  # 진로교육원 전열교환기 필터 교체
  - 수리
  - 도색
  - 위험성평가
  - 천막  # (비즈쿨) 페스티벌 부스 천막 대여
  - 대여
  - 건축
  # 9/30: '창업 멘토링 우수사례집 발간 및 콘텐츠 제작 용역'이 검토로 들어옴 (책자 제작이지 운영이 아님)
  - 발간
  - 사례집
